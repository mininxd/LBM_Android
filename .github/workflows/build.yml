name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare native libraries if gen/ is missing
        run: |
          if [ ! -d "gen" ] || [ -z "$(ls -A gen/*.c 2>/dev/null)" ]; then
            echo "gen/*.c not found in repo. Fetching prebuilt native libraries..."
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            curl -L -s -o /tmp/base.apk https://github.com/ttom795/LBM_Android/releases/download/0.1.6/LegoBatman-0.1.6.apk
            unzip -q -j /tmp/base.apk "lib/arm64-v8a/*" -d android/app/src/main/jniLibs/arm64-v8a/
            rm -f /tmp/base.apk
            python3 -c "
            path = 'android/app/src/main/jniLibs/arm64-v8a/libmain.so'
            with open(path, 'rb') as f:
                data = bytearray(f.read())
            old_pattern = bytes.fromhex('68 06 00 f0 69 06 00 f0 08 11 44 f9 29 15 44 f9 14 01 00 b9 e8 13 40 b9 28 01 00 b9')
            new_pattern = bytes.fromhex('68 06 00 f0 08 11 44 f9 94 d2 9a 52 74 0e a0 72 14 01 00 b9 1f 20 03 d5 1f 20 03 d5')
            pos = data.find(old_pattern)
            if pos != -1:
                data[pos:pos+len(new_pattern)] = new_pattern
                with open(path, 'wb') as f:
                    f.write(data)
                print(f'Successfully patched libmain.so at offset {hex(pos)} to force entry point 0x0073d694')
            else:
                print('Warning: pattern not found in libmain.so')
            "
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegoBatman-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
