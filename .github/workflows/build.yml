name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare native libraries if gen/ is missing
        run: |
          if [ ! -d "gen" ] || [ -z "$(ls -A gen/*.c 2>/dev/null)" ]; then
            echo "gen/*.c not found in repo. Fetching prebuilt native libraries..."
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            curl -L -s -o /tmp/base.apk https://github.com/ttom795/LBM_Android/releases/download/0.1.6/LegoBatman-0.1.6.apk
            unzip -q -j /tmp/base.apk "lib/arm64-v8a/*" -d android/app/src/main/jniLibs/arm64-v8a/
            rm -f /tmp/base.apk
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegoBatman-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
